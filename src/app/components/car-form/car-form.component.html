<div class="container mt-4">
    <h2>{{ car.id ? 'Edit' : 'Add' }} Car</h2>
    
    <form (submit)="saveCar()" class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Brand</label>
        <input type="text" class="form-control" [(ngModel)]="car.brand" name="brand" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Model</label>
        <input type="text" class="form-control" [(ngModel)]="car.model" name="model" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Manufacturing Date</label>
        <input type="date" class="form-control" [(ngModel)]="car.manufacturingDate" name="manufacturingDate" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Type</label>
        <input type="text" class="form-control" [(ngModel)]="car.type" name="type" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Rental Price/Day</label>
        <input type="number" step="0.01" class="form-control" [(ngModel)]="car.rentalPricePerDay" name="rentalPricePerDay" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Availability Status</label>
        <select class="form-select" [(ngModel)]="car.availabilityStatus" name="availabilityStatus" required>
          <option value="Available">Available</option>
          <option value="Rented">Rented</option>
          <option value="Maintenance">Maintenance</option>
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">Color</label>
        <input type="text" class="form-control" [(ngModel)]="car.color" name="color" required>
      </div>
      <div class="col-12">
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
